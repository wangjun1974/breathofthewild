<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="呀哈哈" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="旷野之息呀哈哈地图：坐标、地点与找法" />
  <title>BotW 呀哈哈地图</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/korok.png" />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="./assets/korok.png" alt="" class="brand-icon" />
        <div>
          <h1>呀哈哈地图</h1>
          <p id="progress-text">加载中…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-reset-collected" class="btn ghost" type="button">重置收集</button>
        <button id="btn-close-sheet-top" class="btn ghost" type="button" hidden>关闭</button>
      </div>
    </header>

    <nav class="filters" aria-label="筛选">
      <div class="filter-row" id="region-chips" role="tablist"></div>
      <label class="toggle">
        <input type="checkbox" id="only-uncollected" />
        <span>仅未收集</span>
      </label>
    </nav>

    <main id="map" role="application" aria-label="海拉鲁地图"></main>

    <aside id="sheet" class="sheet" hidden aria-live="polite">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>
      <button id="btn-close-sheet" class="sheet-close" type="button" aria-label="关闭">×</button>
      <div id="sheet-body"></div>
    </aside>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
